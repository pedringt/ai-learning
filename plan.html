<!-- Vercel Web Analytics -->
<script>
  // Owner mode: use ?owner=true once to disable Vercel Analytics in this browser.
  // Use ?owner=false to re-enable analytics for this browser.
  (function () {
    const params = new URLSearchParams(window.location.search);
    const ownerParam = params.get('owner');

    if (ownerParam === 'true') {
      localStorage.setItem('paigeOwnerMode', 'true');
    } else if (ownerParam === 'false') {
      localStorage.removeItem('paigeOwnerMode');
    }

    if (ownerParam !== null) {
      params.delete('owner');
      const query = params.toString();
      const cleanUrl = window.location.pathname + (query ? '?' + query : '') + window.location.hash;
      window.history.replaceState({}, '', cleanUrl);
    }

    if (localStorage.getItem('paigeOwnerMode') !== 'true') {
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      const analyticsScript = document.createElement('script');
      analyticsScript.defer = true;
      analyticsScript.src = '/_vercel/insights/script.js';
      document.head.appendChild(analyticsScript);
    }
  })();
</script>

# Authoritative Render configuration for the State backend.
#
# This file is the ONLY Render config for this project. Render reads it from the
# repository root and builds `state-project-complete` (rootDir below) from `main`.
# A second, stale config previously lived at state-project-complete/render.yaml and
# disagreed with this one about the Python version and the database configuration.
# It has been removed. Do not reintroduce a service-local render.yaml.
#
# What this file does NOT declare (Nov 5 audit). These exist only in the Render dashboard, so they are recorded
# here rather than added as config: a `disk:` block or a second service whose name or size did not match the
# dashboard could make Render create or change a disk or service. Copy the real values from the dashboard first.
# - Persistent disk on state-api, mounted at /var/data. Production data is SQLite at /var/data/state.db.
#   Render snapshots it once every 24 hours; take a manual backup before schema changes (see CLAUDE.md).
# - state-api-staging: free plan, branch staging, deploys only on state-project-complete/** changes, no disk
#   (it re-seeds on every deploy). Its env vars, including CORS_ORIGINS, differ from production's.
# - Dashboard-only env vars on production: DATABASE_URL (it points the app at the SQLite file on the disk; check the
#   dashboard for the exact value) and STATE_ENVIRONMENT, which, if unset, defaults to "production" on main (api_core.py).

services:
  - type: web
    name: state-api
    runtime: python
    # Keep the portfolio demo always available; the free plan sleeps after idle time.
    plan: starter
    rootDir: state-project-complete
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STATE_PROVIDER
        value: anthropic
      - key: STATE_DEMO_BOOTSTRAP
        value: "1"
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
      # Chunking is the primary large-input safeguard. Keep enough structured
      # output headroom for dense chunks with several legitimate proposals.
      - key: CLAUDE_MAX_TOKENS
        value: "2000"
      - key: CLAUDE_TIMEOUT_SECONDS
        value: "30"
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://ai-learning-rouge.vercel.app,https://authenticignorance.site,https://www.authenticignorance.site,https://contextswitch.tech,https://www.contextswitch.tech,https://state.contextswitch.tech
      # Slack Phase 1 (deterministic intake only; see
      # docs/architecture/SLACK_INTEGRATION_PLAN.md). Unset SLACK_SIGNING_SECRET
      # disables the /api/integrations/slack/events endpoint outright (503).
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_TEAM_ID
        sync: false
      - key: SLACK_CHECKPOINT_POLL_SECONDS
        sync: false
      # Auto-approved at startup since there is no admin UI yet (see
      # ensure_channel_approved in slack_intake_service.py). Production's
      # SQLite database persists on its Render disk (/var/data); the auto-approval
      # matters for ephemeral environments such as staging, which re-seed on every deploy.
      - key: SLACK_TEST_CHANNEL_ID
        sync: false
      - key: SLACK_TEST_CHANNEL_NAME
        value: state-test

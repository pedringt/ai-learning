# Authoritative Render configuration for the State backend.
#
# This file is the ONLY Render config for this project. Render reads it from the
# repository root and builds `state-project-complete` (rootDir below) from `main`.
# A second, stale config previously lived at state-project-complete/render.yaml and
# disagreed with this one about the Python version and the database configuration.
# It has been removed. Do not reintroduce a service-local render.yaml.

services:
  - type: web
    name: state-api
    runtime: python
    # Keep the portfolio demo always available; the free plan sleeps after idle time.
    plan: starter
    rootDir: state-project-complete
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STATE_PROVIDER
        value: anthropic
      - key: STATE_DEMO_BOOTSTRAP
        value: "1"
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5-20251001
      - key: CLAUDE_MAX_TOKENS
        value: "1200"
      - key: CLAUDE_TIMEOUT_SECONDS
        value: "30"
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://ai-learning-rouge.vercel.app

services:
  - type: web
    name: state-api
    env: python
    plan: free
    pythonVersion: 3.12
    
    # Build and start commands
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    
    # Environment variables (you'll fill these in during deploy)
    envVars:
      - key: ANTHROPIC_API_KEY
        scope: run
        sync: false  # Sensitive - never sync to git
      
      - key: OPENAI_API_KEY
        scope: run
        sync: false
      
      - key: STATE_PROVIDER
        value: anthropic
      
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5-20251001  # Low-latency interpreter; override to Sonnet if evaluation shows a quality regression
      
      - key: CLAUDE_MAX_TOKENS
        value: 1200

      - key: DATABASE_URL
        scope: run
        sync: false  # Neon Postgres connection string
      
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://ai-learning-rouge.vercel.app

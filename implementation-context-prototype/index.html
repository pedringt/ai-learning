  <script>
    (function(){
      var host=String(location.hostname||'').toLowerCase();
      if(host!=='state.contextswitch.tech') return;
      var analytics=document.createElement('script');
      analytics.defer=true;
      analytics.src='https://cdn.vercel-insights.com/v1/script.js';
      analytics.setAttribute('data-state-production-analytics','true');
      document.head.appendChild(analytics);
    })();
  </script>
  <script>
    document.documentElement.classList.add('state-prepaint','state-final-mobile-pending');
    window.__stateRevealTimer=setTimeout(function(){document.documentElement.classList.remove('state-prepaint');},1200);
    window.__stateFinalMobileTimer=setTimeout(function(){document.documentElement.classList.remove('state-final-mobile-pending');},1400);
  </script>
  <style id="state-prepaint-guard">
    html.state-prepaint .prototype-productbar,html.state-prepaint .software-shell,html.state-final-mobile-pending .prototype-productbar,html.state-final-mobile-pending .software-shell{visibility:hidden!important;}
  </style>
  <script>
    (function(){
      // Directory this page is served from, with a trailing slash. Vercel's cleanUrls serves the app
      // at ".../implementation-context-prototype" (no slash, no file name), so plain relative URLs would
      // resolve one level too high. Computing it also works at a domain root and from file://.
      var path = location.pathname;
      window.__STATE_BASE = /(^|\/)index(\.html)?$/.test(path) ? path.replace(/index(\.html)?$/, '') : (path.slice(-1) === '/' ? path : path + '/');
      document.write('<link rel="icon" href="' + window.__STATE_BASE + 'favicon.svg">');
      document.write('<link rel="stylesheet" href="' + window.__STATE_BASE + 'state-shell.css">');
      document.write('<link rel="stylesheet" href="' + window.__STATE_BASE + 'context-tool.css?v=r118-current-state-feedback">');
    })();
  </script>
  <style id="state-mobile-nav">
    @media(max-width:760px){
      .sidebar-nav,.app-sidebar>.demo-help-button{display:none!important;}
      .mobile-primary-nav,.mobile-subnav{display:flex!important;}
    }
    .mobile-primary-nav,.mobile-subnav{display:none;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:4px;margin:0 -12px;padding:2px 0 2px 12px;position:relative;}
    .mobile-primary-nav::-webkit-scrollbar,.mobile-subnav::-webkit-scrollbar{display:none;}
    .mobile-primary-nav{border-bottom:1px solid var(--line);padding-bottom:10px;}
    .mobile-subnav{padding-top:8px;}
    .mobile-primary-nav::after,.mobile-subnav::after{content:"›";position:sticky;right:0;flex:0 0 24px;align-self:stretch;display:grid;place-items:center;background:linear-gradient(90deg,transparent 0%,#f8f7fa 55%,#f8f7fa 100%);color:var(--accent);font-size:17px;font-weight:800;pointer-events:none;}
    body.v88-dark .mobile-primary-nav::after,body.v88-dark .mobile-subnav::after{background:linear-gradient(90deg,transparent 0%,#14131a 55%,#14131a 100%);}
    .mobile-primary-nav .nav-item,.mobile-subnav button{flex:0 0 auto;white-space:nowrap;width:auto!important;display:inline-flex!important;align-items:center;gap:4px;padding:7px 12px!important;border-radius:999px!important;font-size:12px!important;color:var(--muted);background:var(--surface2);border:0;cursor:pointer;}
    .mobile-primary-nav .nav-item.active,.mobile-subnav button.active{background:var(--accent-soft);color:var(--accent);font-weight:800;}
    .mobile-primary-nav .nav-count{width:auto!important;height:auto!important;min-width:16px!important;padding:0 5px!important;border-radius:999px!important;background:var(--accent-soft);color:var(--accent);font-weight:750;}
    .mobile-primary-nav .nav-count[hidden]{display:none!important;}
    .mobile-subnav[hidden]{display:none!important;}
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&display=swap">
  <script>
    // Layer styles that the context-*.js scripts used to inject at runtime (#450). Must stay after
    // context-tool.css and the inline styles above so the cascade order is unchanged.
    document.write('<link rel="stylesheet" href="' + window.__STATE_BASE + 'state-app.css?v=2">');
  </script>
</head>
<body>
  <div class="prototype-productbar"><span class="product-mark" aria-hidden="true">◆</span><button type="button" class="product-name product-home" data-view="overview" aria-label="Return to Workspace">State</button><span class="product-divider" aria-hidden="true">·</span><span class="product-tagline">Maintained project understanding, not reconstructed history.</span><a class="product-case-study" href="https://www.contextswitch.tech/implementation-context" target="_blank" rel="noopener noreferrer">Case study</a></div>
  <main class="app-shell software-shell">
    <h1 class="visually-hidden">State project workspace</h1>
    <aside class="app-sidebar" aria-label="Project workspace">
      <div class="sidebar-project"><span class="meta-label">Project</span><button class="project-switcher" id="projectSwitcher" data-action="toggle-projects" aria-expanded="false" aria-controls="projectMenu">Loading… <span>⌄</span></button><div class="project-menu" id="projectMenu" hidden></div></div>
      <nav class="sidebar-nav"><button class="nav-item active" data-view="overview"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg></span><span class="nav-label">Workspace</span></button><div class="sidebar-nav-group project-nav-group"><button class="nav-item project-nav-toggle" data-view="project-overview"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span><span class="nav-label">Current State</span></button><div class="project-subnav" id="projectSubnav" hidden><button data-project-jump="project-top">Overview</button></div></div><button class="nav-item open-items-nav-toggle" data-view="open-items"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg></span><span class="nav-label">Open Items</span><span class="nav-count" id="openItemsActionCount" hidden></span></button><button class="nav-item" data-view="notes"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h4"/></svg></span><span class="nav-label">Notes</span></button><button class="nav-item" data-view="history"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 7V3m0 4h4M4.5 7A9 9 0 1 1 3 15"/><path d="M12 7v5l3 2"/></svg></span><span class="nav-label">History</span></button><button class="nav-item" data-view="settings"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.7-.7-1.7.9-1.9-2.1-2.1-1.9.9-1.7-.7L10.5 2h-3l-.7 2.3-1.7.7-1.9-.9-2.1 2.1.9 1.9-.7 1.7-2 .7v3l2 .7.7 1.7-.9 1.9 2.1 2.1 1.9-.9 1.7.7.7 2.3h3l.7-2.3 1.7-.7 1.9.9 2.1-2.1-.9-1.9.7-1.7z" transform="translate(2.25 0) scale(.8)"/></svg></span><span class="nav-label">Settings</span></button></nav>
      <nav class="mobile-primary-nav" aria-label="Project navigation"><button class="nav-item active" data-view="overview">Workspace</button><button class="nav-item open-items-nav-toggle" data-view="open-items">Open Items <span class="nav-count" id="mobileOpenItemsCount" hidden></span></button><button class="nav-item" data-view="project-overview">Current State</button><button class="nav-item" data-view="notes">Notes</button><button class="nav-item" data-view="history">History</button><button class="nav-item" data-view="settings">Settings</button></nav>
      <nav class="mobile-subnav" id="mobileProjectSubnav" hidden aria-label="Current State sections"><button data-project-jump="project-top">Overview</button></nav>
      <button class="demo-help-button state-help-card" data-action="show-demo-help"><span class="state-help-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22zM20 5.5A3.5 3.5 0 0 0 16.5 2H13v17h3.5A3.5 3.5 0 0 1 20 22z"/></svg></span><span class="state-help-copy"><strong>Need help?</strong><span>Learn how State works</span></span></button>

  <div class="overlay" id="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"><button class="dialog-close" aria-label="Close" data-action="close-dialog">×</button><div id="dialogBody"></div></section></div>
  <script>
    (function(){
      var local = location.protocol === 'file:';
      document.write('<script src="' + window.__STATE_BASE + 'state-shell.js"><\/script>');
      if(!local) document.write('<script src="/api/state-config.js"><\/script>');
      var v='r119-cowork-fixes';
      ['context-analytics.js','context-data.js','context-api.js','context-evidence-resilience.js','context-ask.js','context-ask-followup.js','context-notes-view.js','context-open-items-view.js','context-project-view.js','context-backend-sync.js','context-app.js','context-baseline.js','context-history.js','context-provenance.js','context-product-polish.js','context-ask-question-handoff.js','context-settings.js','context-ask-controls.js','context-layout.js'].forEach(function(file){document.write('<script src="'+window.__STATE_BASE+file+'?v='+v+'"><\/script>');});
      document.write('<script>requestAnimationFrame(function(){requestAnimationFrame(function(){document.documentElement.classList.remove("state-prepaint");clearTimeout(window.__stateRevealTimer);});});<\/script>');
    })();
  </script>
  <script>
    (function(){
      function syncNoteLifecycle(){
        document.querySelectorAll("[data-action='send-note-review']").forEach(function(btn){if(btn.textContent.trim()==='Send as Evidence') btn.textContent='Submit for review';});
        document.querySelectorAll('.notes-page .note-index-row').forEach(function(row){var submitted=row.querySelector('.note-status--pending,.note-status--reviewed,.note-status--no-review-needed,.note-status--unknown');var edit=row.querySelector("[data-action='edit-note']");if(submitted&&edit) edit.remove();});
      }
      var observer=new MutationObserver(syncNoteLifecycle);observer.observe(document.body,{childList:true,subtree:true});syncNoteLifecycle();
    })();
  </script>
</body>

      ['context-analytics.js','context-data.js','context-api.js','context-ask.js','context-ask-followup.js','context-notes-view.js','context-open-items-view.js','context-project-view.js','context-backend-sync.js','context-app.js','context-history.js','context-provenance.js','context-quickwins.js','context-product-polish.js','context-settings.js','context-sources.js','context-design-pass.js','context-feedback-pass.js','context-feedback-pass-2.js','context-feedback-pass-3.js','context-feedback-pass-4.js','context-attention-alignment.js','context-final-mobile.js'].forEach(function(file){document.write('<script src="'+(local?'':'/implementation-context-prototype/')+file+'?v='+v+'"><\/script>');});

    })();
  </script>
  <script>
    (function(){
      function syncNoteLifecycle(){
        document.querySelectorAll("[data-action='send-note-review']").forEach(function(btn){if(btn.textContent.trim()==='Send as Evidence') btn.textContent='Submit for review';});
        document.querySelectorAll('.notes-page .note-index-row').forEach(function(row){var submitted=row.querySelector('.note-status--pending,.note-status--reviewed,.note-status--no-review-needed,.note-status--unknown');var edit=row.querySelector("[data-action='edit-note']");if(submitted&&edit) edit.remove();});
      }
      var observer=new MutationObserver(syncNoteLifecycle);observer.observe(document.body,{childList:true,subtree:true});syncNoteLifecycle();
    })();
  </script>

name: Rebuild Applied Work section

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/rebuild-applied-work.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Replace Applied Work markup and styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          start_marker = '<section class="view" data-page="portfolio" id="portfolio">'
          start = text.index(start_marker)
          end = text.index('\n<script>', start)

          portfolio = '''<section class="view" data-page="portfolio" id="portfolio">
          <header class="page-intro portfolio-intro">
            <div class="eyebrow">Applied Work</div>
            <h2 class="section-title">Projects and opportunity evaluations</h2>
            <p class="section-lead">A product I built, the decisions behind it, and other AI opportunities I've evaluated.</p>
          </header>

          <article class="portfolio-flagship" aria-labelledby="portfolio-state-title">
            <div class="portfolio-flagship-copy">
              <span class="tag">Flagship project</span>
              <h3 id="portfolio-state-title"><a href="implementation-context.html">State</a></h3>
              <p class="portfolio-flagship-lead">A project-context product I built and tested to understand what AI should be allowed to change.</p>
              <p class="portfolio-authority">AI interprets → software enforces → people authorize.</p>
              <div class="portfolio-flagship-actions">
                <a class="portfolio-primary-action" href="implementation-context.html">Read case study →</a>
                <a class="portfolio-secondary-action" href="implementation-context-prototype/index.html">Open State →</a>
              </div>
            </div>
            <a class="portfolio-flagship-media" href="implementation-context-prototype/index.html" aria-label="Open the State product">
              <img src="assets/state-workspace-card.webp" alt="State Workspace showing items waiting for review, recent project changes, and current project state." loading="lazy" decoding="async"/>
            </a>
          </article>

          <section class="portfolio-section portfolio-deep-dives" aria-labelledby="portfolio-deep-dives-title">
            <header class="portfolio-section-heading">
              <h3 id="portfolio-deep-dives-title">Go deeper into State</h3>
              <p>Focused cases on how I tested the product and what building it changed.</p>
            </header>
            <div class="portfolio-deep-grid">
              <a class="portfolio-card portfolio-deep-card" href="state-testing-debugging.html">
                <span class="tag">Validation &amp; debugging</span>
                <h4>Testing &amp; Debugging</h4>
                <p>How I tested State and traced failures to the right layer before deciding what to change.</p>
                <span class="portfolio-card-path">Read case →</span>
              </a>
              <a class="portfolio-card portfolio-deep-card" href="state-architecture-cost.html">
                <span class="tag">Architecture &amp; cost</span>
                <h4>Architecture &amp; Cost: Before vs. After</h4>
                <p>What building State changed about my assumptions on model choice, latency, context, cost, and what should stay deterministic.</p>
                <span class="portfolio-card-path">Read case →</span>
              </a>
            </div>
          </section>

          <section class="portfolio-section portfolio-other-work" aria-labelledby="portfolio-other-title">
            <header class="portfolio-section-heading">
              <h3 id="portfolio-other-title">Other applied work</h3>
              <p>Different problems that show how I evaluate opportunities, workflows, evidence, and tradeoffs.</p>
            </header>
            <div class="portfolio-other-grid">
              <a class="portfolio-card portfolio-other-card" href="legal-ai-governance.html">
                <span class="tag">Opportunity evaluation</span>
                <h4>Legal AI Governance</h4>
                <p>I investigated a documented compliance gap and found that the firms with the clearest structural need may be the least attractive clients to pursue one at a time. My recommendation: do not propose an offering until direct customer discovery changes that commercial picture.</p>
                <span class="portfolio-card-path">Read evaluation →</span>
              </a>
              <a class="portfolio-card portfolio-other-card" href="meridian.html">
                <span class="tag">Simulated pilot · Customer support</span>
                <h4>Meridian AI Support Pilot</h4>
                <p>A simulated support pilot showing the workflow, discovery questions, and metrics I revised when the evidence did not support my first answer.</p>
                <span class="portfolio-card-path">Read pilot →</span>
              </a>
            </div>
          </section>
          </section>'''

          index.write_text(text[:start] + portfolio + text[end:])

          css = r'''/* Applied Work: explicit hierarchy for one flagship project plus supporting cases. */

          #ai-cs-mock #portfolio::before,
          #ai-cs-mock #portfolio::after{
            display:none!important;
            content:none!important;
          }

          #ai-cs-mock #portfolio .portfolio-intro{
            max-width:900px!important;
            margin-bottom:28px!important;
          }

          #ai-cs-mock #portfolio .portfolio-flagship{
            display:grid!important;
            grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr)!important;
            gap:32px!important;
            align-items:center!important;
            margin:0!important;
            padding:30px!important;
            border:1px solid color-mix(in srgb,var(--purple) 30%,var(--border))!important;
            border-radius:22px!important;
            background:linear-gradient(145deg,color-mix(in srgb,var(--softp) 80%,var(--card)) 0%,var(--card) 76%)!important;
            box-shadow:0 16px 36px color-mix(in srgb,var(--purple) 9%,transparent)!important;
            overflow:hidden!important;
          }

          #ai-cs-mock #portfolio .portfolio-flagship-copy{
            min-width:0!important;
          }

          #ai-cs-mock #portfolio .portfolio-flagship .tag{
            margin-bottom:12px!important;
          }

          #ai-cs-mock #portfolio .portfolio-flagship h3{
            margin:0 0 12px!important;
            font-size:clamp(34px,4vw,48px)!important;
            line-height:1!important;
            letter-spacing:-.035em!important;
          }

          #ai-cs-mock #portfolio .portfolio-flagship h3 a{
            color:var(--ink)!important;
            text-decoration:none!important;
          }

          #ai-cs-mock #portfolio .portfolio-flagship-lead{
            max-width:520px!important;
            margin:0!important;
            color:var(--muted)!important;
            font-size:17px!important;
            line-height:1.58!important;
          }

          #ai-cs-mock #portfolio .portfolio-authority{
            margin:14px 0 0!important;
            color:var(--ink)!important;
            font-size:14px!important;
            line-height:1.5!important;
            font-weight:750!important;
          }

          #ai-cs-mock #portfolio .portfolio-flagship-actions{
            display:flex!important;
            flex-wrap:wrap!important;
            gap:10px 18px!important;
            margin-top:24px!important;
          }

          #ai-cs-mock #portfolio .portfolio-flagship-actions a{
            font-size:13px!important;
            line-height:1.2!important;
            font-weight:850!important;
            text-decoration:none!important;
          }

          #ai-cs-mock #portfolio .portfolio-primary-action,
          #ai-cs-mock #portfolio .portfolio-secondary-action{
            color:var(--purple)!important;
          }

          #ai-cs-mock #portfolio .portfolio-flagship-media{
            display:block!important;
            min-width:0!important;
            overflow:hidden!important;
            border:1px solid color-mix(in srgb,var(--purple) 18%,var(--border))!important;
            border-radius:16px!important;
            background:var(--soft)!important;
            box-shadow:0 12px 28px rgba(20,24,40,.10)!important;
          }

          #ai-cs-mock #portfolio .portfolio-flagship-media img{
            display:block!important;
            width:100%!important;
            height:auto!important;
            aspect-ratio:1.91 / 1!important;
            object-fit:cover!important;
            object-position:left top!important;
          }

          #ai-cs-mock #portfolio .portfolio-section{
            margin-top:36px!important;
            padding-top:24px!important;
            border-top:1px solid var(--border)!important;
          }

          #ai-cs-mock #portfolio .portfolio-section-heading{
            display:flex!important;
            align-items:flex-end!important;
            justify-content:space-between!important;
            gap:24px!important;
            margin-bottom:16px!important;
          }

          #ai-cs-mock #portfolio .portfolio-section-heading h3{
            margin:0!important;
            color:var(--ink)!important;
            font-size:21px!important;
            line-height:1.25!important;
            letter-spacing:-.015em!important;
          }

          #ai-cs-mock #portfolio .portfolio-section-heading p{
            max-width:560px!important;
            margin:0!important;
            color:var(--muted)!important;
            font-size:13px!important;
            line-height:1.5!important;
            text-align:right!important;
          }

          #ai-cs-mock #portfolio .portfolio-deep-grid,
          #ai-cs-mock #portfolio .portfolio-other-grid{
            display:grid!important;
            grid-template-columns:repeat(2,minmax(0,1fr))!important;
            gap:14px!important;
            align-items:stretch!important;
          }

          #ai-cs-mock #portfolio .portfolio-card{
            display:flex!important;
            flex-direction:column!important;
            min-width:0!important;
            min-height:0!important;
            height:auto!important;
            position:relative!important;
            overflow:hidden!important;
            padding:20px 22px!important;
            border:1px solid var(--border)!important;
            border-radius:16px!important;
            background:var(--card)!important;
            color:var(--ink)!important;
            text-decoration:none!important;
            box-shadow:0 8px 24px color-mix(in srgb,var(--purple) 4%,transparent)!important;
            transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease!important;
          }

          #ai-cs-mock #portfolio .portfolio-card:hover{
            transform:translateY(-2px)!important;
            border-color:color-mix(in srgb,var(--purple) 32%,var(--border))!important;
            box-shadow:0 12px 28px color-mix(in srgb,var(--purple) 8%,transparent)!important;
          }

          #ai-cs-mock #portfolio .portfolio-deep-card{
            padding:18px 20px!important;
            background:color-mix(in srgb,var(--softp) 42%,var(--card))!important;
            border-color:color-mix(in srgb,var(--purple) 22%,var(--border))!important;
          }

          #ai-cs-mock #portfolio .portfolio-card .tag{
            margin-bottom:10px!important;
          }

          #ai-cs-mock #portfolio .portfolio-card h4{
            margin:0 0 8px!important;
            color:var(--purple)!important;
            font-size:20px!important;
            line-height:1.25!important;
            letter-spacing:-.018em!important;
          }

          #ai-cs-mock #portfolio .portfolio-deep-card h4{
            font-size:18px!important;
          }

          #ai-cs-mock #portfolio .portfolio-card p{
            margin:0!important;
            color:var(--muted)!important;
            font-size:13.5px!important;
            line-height:1.55!important;
          }

          #ai-cs-mock #portfolio .portfolio-card-path{
            margin-top:auto!important;
            padding-top:14px!important;
            color:var(--purple)!important;
            font-size:12px!important;
            line-height:1.2!important;
            font-weight:850!important;
          }

          @media(max-width:900px){
            #ai-cs-mock #portfolio .portfolio-flagship{
              grid-template-columns:1fr!important;
              gap:24px!important;
            }
            #ai-cs-mock #portfolio .portfolio-flagship-lead{
              max-width:700px!important;
            }
            #ai-cs-mock #portfolio .portfolio-section-heading{
              display:block!important;
            }
            #ai-cs-mock #portfolio .portfolio-section-heading p{
              max-width:700px!important;
              margin-top:5px!important;
              text-align:left!important;
            }
          }

          @media(max-width:680px){
            #ai-cs-mock #portfolio .portfolio-flagship{
              padding:22px!important;
              border-radius:18px!important;
            }
            #ai-cs-mock #portfolio .portfolio-flagship h3{
              font-size:34px!important;
            }
            #ai-cs-mock #portfolio .portfolio-flagship-lead{
              font-size:15.5px!important;
            }
            #ai-cs-mock #portfolio .portfolio-flagship-media{
              border-radius:12px!important;
            }
            #ai-cs-mock #portfolio .portfolio-deep-grid,
            #ai-cs-mock #portfolio .portfolio-other-grid{
              grid-template-columns:1fr!important;
            }
            #ai-cs-mock #portfolio .portfolio-section{
              margin-top:30px!important;
              padding-top:20px!important;
            }
          }
          '''

          Path('applied-work-finish.css').write_text(css)
          PY

      - name: Commit rebuilt section
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/rebuild-applied-work.yml
          git add index.html applied-work-finish.css .github/workflows/rebuild-applied-work.yml
          git commit -m "Rebuild Applied Work around State flagship"
          git push origin HEAD:staging

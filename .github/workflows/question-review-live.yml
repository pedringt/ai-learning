# Makes real model calls: manually, and weekly on main (about 23 calls; well under
# a cent per run on Haiku 5.5). Controlled evals use temporary test
# databases and record aggregate metrics plus limited failure metadata for failed synthetic scenarios.
# The review suite's aggregates are also saved as Authority Lab evidence (#517).
name: State AI quality check
on:
  schedule:
    # Mondays 14:17 UTC (7:17am Pacific). Scheduled runs use suite=all and record to production.
    - cron: '17 14 * * 1'
  workflow_dispatch:
    inputs:
      suite:
        description: Which AI behavior to check
        required: true
        default: all
        type: choice
        options:
          - all
          - review
          - ask
          - ask-diagnostic-640
          - ask-headline-step1
          - ask-diagnostic-one
          - ask-diagnostic-retention
          - ask-diagnostic-withheld
          - ask-diagnostic-remeasure
          - ask-independent-review-567
      max_calls:
        description: Hard cap on model calls (30 keeps an Ask-only run under $0.05 on Haiku 5.5)
        required: false
        default: '80'
      record_environment:
        description: Where to record aggregate results
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
permissions:
  contents: read
concurrency:
  group: state-ai-quality-check-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  quality:
    # eval/* branches: paid prompt experiments measured before they reach staging (Oct 10).
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/eval/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install quality-check dependencies
        run: pip install -r state-project-complete/requirements.txt
      - name: Run controlled AI quality checks
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STATE_EVAL_INGEST_KEY: ${{ secrets.STATE_EVAL_INGEST_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          if [ "${{ inputs.record_environment || 'production' }}" = "staging" ]; then
            RECORD_URL="https://state-api-staging.onrender.com"
          else
            RECORD_URL="https://state-api-6waw.onrender.com"
          fi
          # Nov 7: the #640 diagnostic (eval/ask_diagnostic_640.py): 3 variants x 5, one Ask call each, nothing recorded.
          if [ "${{ inputs.suite }}" = "ask-diagnostic-640" ] || [ "${{ inputs.suite }}" = "ask-headline-step1" ] || [ "${{ inputs.suite }}" = "ask-diagnostic-one" ] || [ "${{ inputs.suite }}" = "ask-diagnostic-retention" ] || [ "${{ inputs.suite }}" = "ask-diagnostic-withheld" ] || [ "${{ inputs.suite }}" = "ask-diagnostic-remeasure" ] || [ "${{ inputs.suite }}" = "ask-independent-review-567" ]; then
            SET=640; REPEATS=5; [ "${{ inputs.suite }}" = "ask-headline-step1" ] && SET=step1
            # Nov 7: one captured call of the #640 scenario (raw output vs final headline).
            [ "${{ inputs.suite }}" = "ask-diagnostic-one" ] && SET=one && REPEATS=1
            # Nov 11 (#567): the live authority repro's two questions x10, every answer saved whole.
            [ "${{ inputs.suite }}" = "ask-diagnostic-retention" ] && SET=retention && REPEATS=10
            # Nov 11 (#567): batch B2's scenarios that withheld a claim x5, with raw output and unit decisions.
            [ "${{ inputs.suite }}" = "ask-diagnostic-withheld" ] && SET=withheld && REPEATS=5
            # Nov 12 (#567): the six scenarios the over-withholding fix touched, x10, with decisions.
            [ "${{ inputs.suite }}" = "ask-diagnostic-remeasure" ] && SET=remeasure && REPEATS=10
            if [ "${{ inputs.suite }}" = "ask-independent-review-567" ]; then
              # Nov 12 (#567): grade the 28 packet answers (grader sees no ratings), then compare with Paige's review.
              python state-project-complete/eval/run_independent_review_567.py --max-calls "${{ inputs.max_calls || '30' }}" \
                --json diagnostic-report.json
              exit 0
            fi
            python state-project-complete/eval/run_ask_diagnostic.py --set "$SET" --repeats "$REPEATS" \
              --max-calls "${{ inputs.max_calls || '20' }}" --json diagnostic-report.json
            exit 0
          fi
          python state-project-complete/eval/run_quality_evals.py \
            --suite "${{ inputs.suite || 'all' }}" \
            --record-url "$RECORD_URL" \
            --authority-lab-envelope authority-lab-evidence.json \
            --json quality-report.json \
            --max-calls "${{ inputs.max_calls || '80' }}"
      # #517: the review suite's aggregate results as Authority Lab evidence
      # (counts, versions and this run's link; no scenario or model text).
      # Kept 90 days so it can be delivered by hand (#518). Saved even when a
      # scenario failed: a failing run is evidence too.
      - name: Save Authority Lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-lab-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: authority-lab-evidence.json
          retention-days: 90
          if-no-files-found: ignore

      # Nov 7 (Paige): the full report, with every synthetic-fixture answer (passing ones too), the build, model and
      # scoring version, so a passing answer can be read. Artifact only: never sent to the dashboard (DATA_PRIVACY.md).
      - name: Save the full quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            quality-report.json
            diagnostic-report.json
          retention-days: 30
          if-no-files-found: ignore

  walkthrough:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging' && inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        working-directory: qa/deployed
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Walk through deployed staging with the live model
        working-directory: qa/deployed
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node question-review-live.js
      - name: Save results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-review-live
          path: qa/deployed/question-live-results/
          retention-days: 7
          if-no-files-found: warn

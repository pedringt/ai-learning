name: Trim Product Analytics learning section

on:
  push:
    branches:
      - trim-learning-library-analytics
    paths:
      - .github/workflows/trim-learning-library-analytics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trim-learning-library-analytics
          fetch-depth: 0

      - name: Trim Learning Library area 08
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(r'(<details class="learning-stage" id="measurement-business">.*?<div class="stage-body"><div class="stage-group"><h3>What I want to understand</h3>).*?(</div></div>\n</details>)', re.S)
          replacement = r'\1<div class="learning-item"><p>I want to define meaningful product outcomes, make sure the right data is captured, and use product analytics and experiments to understand what users are actually doing. I also want to use AI to accelerate analysis while being able to verify the data, queries, and conclusions. For AI products, that means connecting model and eval performance to normal product and business outcomes.</p></div>\2'

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Stage 08 block, found {count}')

          required = [
              'Product Analytics, Measurement &amp; Business Value',
              'success metrics · instrumentation · funnels/cohorts · experimentation · AI-assisted analysis · ROI',
              'connecting model and eval performance to normal product and business outcomes',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'Missing expected text: {needle}')

          for needle in ['Measurement strategy.', 'Instrumentation &amp; analytics QA.', 'Experimentation &amp; evidence.', 'AI products as an extension.']:
              if needle in text:
                  raise SystemExit(f'Old detailed copy still present: {needle}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Remove helper and commit
        shell: bash
        run: |
          rm .github/workflows/trim-learning-library-analytics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/trim-learning-library-analytics.yml
          git diff --cached --check
          git commit -m "Trim Product Analytics learning section"
          git push origin HEAD:trim-learning-library-analytics

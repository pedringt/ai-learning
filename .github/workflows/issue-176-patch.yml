name: Issue 176 patch index

on:
  push:
    branches:
      - feature/issue-176-library-positioning
    paths:
      - .github/workflows/issue-176-patch.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-176-library-positioning
          fetch-depth: 0
      - name: Apply scoped Issue 176 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def replace_exact(old, new, expected, label):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} match(es), found {count}")
              text = text.replace(old, new)

          old_meta = "A practical AI learning portfolio showing applied judgment across workflow discovery, system design, evaluation, adoption, measurement, and business value."
          new_meta = "A practical AI learning portfolio focused on applied product judgment, trustworthy AI systems, and evidence-led decisions."
          replace_exact(old_meta, new_meta, 3, "meta description")

          replace_exact('<button data-view="learn">Learning Guide</button>', '<button data-view="learn">Learning Library</button>', 1, "desktop learning nav")
          replace_exact('<option value="learn">Learning Guide</option>', '<option value="learn">Learning Library</option>', 1, "mobile learning nav")
          replace_exact("learn:'Learning Guide · AI Learning Portfolio'", "learn:'Learning Library · AI Learning Portfolio'", 1, "learning page title")

          old_home = '<section aria-label="Continue exploring" class="home-quiet-ending"><h2>Backed by an ongoing learning system</h2><p>State and Legal AI both draw on a structured framework I keep building on: eight domains, each with core concepts, references, and practice exercises.</p><span><a data-view-link="learn" href="#learn">Open the full framework →</a></span></section>'
          new_home = '<section aria-label="Continue exploring" class="home-quiet-ending"><h2>How I’m approaching the learning</h2><p>AI is moving quickly, so I’m learning the current tools without treating them as the curriculum. I’m focusing on the product skills that should remain useful as the technology changes.</p><span><a data-view-link="learn" href="#learn">Open the Learning Library →</a></span></section>'
          replace_exact(old_home, new_home, 1, "homepage learning positioning")

          replace_exact('Practical eval cases for integrity, uncertainty, consequentiality, and review burden', 'Practical eval cases tied to State’s highest-risk behaviors', 1, "homepage eval subtitle")
          replace_exact('Discovery, workflow design, evaluation, and measurement in a simulated support pilot', 'A simulated support pilot shaped by discovery and evidence-led iteration', 1, "homepage Meridian subtitle")

          start_marker = '<section class="view" data-page="learn" id="learn">'
          end_marker = '<section class="view" data-page="portfolio" id="portfolio">'
          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start < 0 or end < 0:
              raise SystemExit("Could not find Learning Library section boundaries")

          new_learning = Path(".github/issue-176-learning.html").read_text(encoding="utf-8")
          text = text[:start] + new_learning + "\n" + text[end:]

          old_portfolio_header = '<section class="view" data-page="portfolio" id="portfolio"><header class="page-intro"><div class="eyebrow">Applied Work</div><h2 class="section-title">Projects and opportunity evaluations</h2><p class="section-lead">State is the deepest project here and the one that most changed how I think about working with AI. Legal AI is the strongest opportunity evaluation; the smaller exercises are supporting work.</p></header>'
          new_portfolio_header = '<section class="view" data-page="portfolio" id="portfolio"><header class="page-intro"><div class="eyebrow">Applied Work</div><h2 class="section-title">Projects that exercise different kinds of product judgment</h2><p class="section-lead">The work here is less about collecting AI technologies and more about making decisions with imperfect evidence: what to build, what to constrain, and when to change course.</p></header>'
          replace_exact(old_portfolio_header, new_portfolio_header, 1, "Applied Work header")

          replacements = [
              (
                  'How I combined hands-on QA, AI-assisted automated coverage, and failure investigation to distinguish model, retrieval, implementation, and product-design failures.',
                  'How I combined hands-on QA with AI-assisted automated coverage to locate the failure before choosing a fix.',
                  'Testing card'
              ),
              (
                  'A controlled State Question Investigator exercise where tracing showed that the agent found the right evidence but overstated what it established, leading to a targeted authority fix and exact-case retest.',
                  'Tracing showed the agent found the right evidence but overstated what it established, so I fixed the authority rule rather than changing retrieval.',
                  'Agent tracing card'
              ),
              (
                  'How I turned State’s failure risks into practical eval cases for integrity, uncertainty, consequentiality, and review burden, then used the results to decide what needed fixing.',
                  'How I turned State’s highest-risk behaviors into practical eval cases, then used the results to decide what needed fixing.',
                  'Evals card'
              ),
              (
                  'I revisited the architecture and cost assumptions I made before integrating AI into State and compared them with what the working product taught me about model choice, latency, context, and what should stay deterministic.',
                  'I revisited the architecture and cost assumptions I made before integrating AI into State and compared them with what the working product taught me about where AI added value and where deterministic software was the better choice.',
                  'Architecture card'
              ),
              (
                  'How an AI-assisted support pilot handles a ticket step by step, the discovery questions that most changed the design, and the pilot metrics I revised once evidence didn’t support my first answer.',
                  'A simulated support pilot where discovery changed the design and weak evidence changed my first measurement recommendation.',
                  'Meridian card'
              ),
          ]
          for old, new, label in replacements:
              replace_exact(old, new, 1, label)

          path.write_text(text, encoding="utf-8")

          learn_start = text.index(start_marker)
          learn_end = text.index(end_marker, learn_start)
          learn = text[learn_start:learn_end]
          if learn.count('<details class="learning-stage"') != 10:
              raise SystemExit("Learning Library does not contain exactly 10 coverage areas")
          if 'practice callout-practice' in learn or '<h3>Practice</h3>' in learn:
              raise SystemExit("Exercise/practice content leaked into the Learning Library")
          if text.count('AI is moving quickly, so I’m learning the current tools without treating them as the curriculum.') != 1:
              raise SystemExit("Homepage positioning line is missing or duplicated")
          for required in [
              'Business &amp; Workflow Discovery',
              'AI Opportunity &amp; Product Judgment',
              'AI Systems &amp; Technical Fluency',
              'Quality, Evals &amp; Reliability',
              'Governance, Risk &amp; Human Control',
              'AI UX &amp; Workflow Design',
              'Implementation, Adoption &amp; Change',
              'Business Value &amp; Continuous Improvement',
              'AI Consulting &amp; Client Work',
              'AI Landscape &amp; Professional Edge',
          ]:
              if required not in learn:
                  raise SystemExit(f"Missing coverage area: {required}")
          PY
      - name: Check patch
        shell: bash
        run: |
          git diff --check
          git diff --stat
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              pass
          Parser().feed(Path('index.html').read_text(encoding='utf-8'))
          print('HTML parser check passed')
          PY
      - name: Commit patched index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Implement issue #176 portfolio positioning"
          git push origin HEAD:feature/issue-176-library-positioning

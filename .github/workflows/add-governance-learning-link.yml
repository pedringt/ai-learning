name: Add governance learning resource link

on:
  push:
    branches: [staging]
    paths:
      - '.github/trigger-governance-link'

permissions:
  contents: write

jobs:
  update-learning-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Add governance PDF link and clean up trigger
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text()
          href = 'cheat-sheets/AI_Governance_Risk_PM_Cheat_Sheet.pdf'
          if href not in html:
              marker = '<details class="learning-stage" id="governance-human-control">'
              start = html.index(marker)
              end = html.index('</details>', start)
              block = html[start:end]
              needle = '</div>\n</details>'
              resource = '<div class="resource-row"><a class="resource-link" href="cheat-sheets/AI_Governance_Risk_PM_Cheat_Sheet.pdf" target="_blank" rel="noopener noreferrer">AI governance, safety &amp; privacy</a></div>'
              stage_close = block.rfind('</div>')
              if stage_close == -1:
                  raise SystemExit('Could not find governance stage-body close')
              block = block[:stage_close] + resource + block[stage_close:]
              html = html[:start] + block + html[end:]
              p.write_text(html)
              print('Added governance learning resource link')
          else:
              print('Governance learning resource link already present')
          PY
          rm -f .github/trigger-governance-link .github/workflows/add-governance-learning-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github
          git commit -m "Add governance cheat sheet to Learning Library"
          git push origin HEAD:staging

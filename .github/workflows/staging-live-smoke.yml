name: staging-live-smoke

on:
  pull_request:

jobs:
  live-staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STAGING_API: https://state-api-staging.onrender.com
    steps:
      - name: Wake staging and verify health
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 90 "$STAGING_API/health"

      - name: Verify bootstrap contract
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = os.environ['STAGING_API']
          with urllib.request.urlopen(base + '/api/bootstrap', timeout=60) as r:
              payload = json.load(r)
          required = {'state','questions','open_reviews','resolved_reviews','history','evidence','rules','drafts'}
          missing = required - set(payload)
          assert not missing, f'missing bootstrap keys: {sorted(missing)}'
          print('bootstrap ok', {k: len(payload.get(k, [])) if isinstance(payload.get(k), list) else type(payload.get(k)).__name__ for k in sorted(required)})
          PY

      - name: Exercise free-form Ask prompts independently
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base = os.environ['STAGING_API']
          prompts = [
              'Summarize the current pilot plan concisely.',
              'What is still unresolved about the pilot, and what needs attention?',
              'What evidence supports the current human review boundary?',
              'Give me a concise meeting-prep summary of the pilot, including current facts, unresolved questions, and anything blocking progress.',
              'What changed recently, and which changes are accepted versus still awaiting review?'
          ]
          def has_visible_content(answer):
              if str(answer.get('headline') or '').strip() or str(answer.get('summary') or '').strip():
                  return True
              return any(str(item.get('text') or '').strip() for section in answer.get('sections') or [] for item in section.get('items') or [])
          results=[]
          for i, query in enumerate(prompts, 1):
              body=json.dumps({'query':query}).encode()
              req=urllib.request.Request(base+'/api/ask',data=body,headers={'Content-Type':'application/json'},method='POST')
              started=time.time()
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      payload=json.load(r)
                  elapsed=time.time()-started
                  answer=payload.get('answer')
                  ok=isinstance(payload.get('selection'),dict) and isinstance(answer,dict) and has_visible_content(answer)
                  timing=payload.get('timing') or {}
                  print(f'ASK {i} {"OK" if ok else "INVALID"} elapsed={elapsed:.2f}s provider_ms={timing.get("provider_ms")} total_ms={timing.get("total_ms")} headline={(answer or {}).get("headline")!r}')
                  results.append(ok)
              except urllib.error.HTTPError as e:
                  elapsed=time.time()-started
                  detail=e.read().decode('utf-8','replace')
                  print(f'ASK {i} HTTP_{e.code} elapsed={elapsed:.2f}s detail={detail[:500]}')
                  results.append(False)
              except Exception as e:
                  elapsed=time.time()-started
                  print(f'ASK {i} ERROR elapsed={elapsed:.2f}s type={type(e).__name__} detail={e}')
                  results.append(False)
          print('ASK_SUMMARY',json.dumps({'passed':sum(results),'failed':len(results)-sum(results),'results':results}))
          PY

      - name: Verify free-form Ask streaming independently
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['STAGING_API']
          body=json.dumps({'query':'What should I know before the next pilot meeting?'}).encode()
          req=urllib.request.Request(base+'/api/ask/stream',data=body,headers={'Content-Type':'application/json','Accept':'text/event-stream'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=45) as r:
                  text=r.read().decode('utf-8','replace')
              print('STREAM_SUMMARY',json.dumps({'final': 'event: final' in text,'error':'event: error' in text,'delta':'event: delta' in text,'bytes':len(text)}))
          except Exception as e:
              print('STREAM_ERROR',type(e).__name__,str(e))
          PY

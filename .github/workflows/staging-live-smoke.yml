name: staging-live-smoke

on:
  pull_request:

jobs:
  live-staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_API: https://state-api-staging.onrender.com
    steps:
      - name: Wake staging and verify health
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 90 "$STAGING_API/health"

      - name: Verify bootstrap contract
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = os.environ['STAGING_API']
          with urllib.request.urlopen(base + '/api/bootstrap', timeout=60) as r:
              payload = json.load(r)
          required = {'state','questions','open_reviews','resolved_reviews','history','evidence','rules','drafts'}
          missing = required - set(payload)
          assert not missing, f'missing bootstrap keys: {sorted(missing)}'
          print('bootstrap ok', {k: len(payload.get(k, [])) if isinstance(payload.get(k), list) else type(payload.get(k)).__name__ for k in sorted(required)})
          PY

      - name: Probe free-form Ask response shape
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base = os.environ['STAGING_API']
          query = 'Summarize the current pilot plan in three concise bullets.'
          body = json.dumps({'query': query}).encode()
          req = urllib.request.Request(base + '/api/ask', data=body, headers={'Content-Type':'application/json'}, method='POST')
          started = time.time()
          try:
              with urllib.request.urlopen(req, timeout=45) as r:
                  payload = json.load(r)
          except urllib.error.HTTPError as e:
              detail = e.read().decode('utf-8', 'replace')
              raise AssertionError(f'Ask HTTP {e.code}: {detail[:2000]}')
          elapsed = time.time() - started
          print('RAW_PAYLOAD', json.dumps(payload, ensure_ascii=False, sort_keys=True)[:12000])
          print(f'elapsed={elapsed:.2f}s')
          assert isinstance(payload.get('selection'), dict), 'Ask missing selection'
          assert isinstance(payload.get('answer'), dict), 'Ask missing answer'
          PY

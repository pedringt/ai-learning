name: staging-live-smoke

on:
  pull_request:

jobs:
  live-staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STAGING_API: https://state-api-staging.onrender.com
    steps:
      - name: Verify 2400-token staging build is live
        run: |
          python - <<'PY'
          import json, os, urllib.request
          with urllib.request.urlopen(os.environ['STAGING_API'] + '/health', timeout=60) as r:
              payload=json.load(r)
          print('HEALTH', json.dumps(payload, sort_keys=True))
          assert str(payload.get('build','')).startswith('90eda64a461e'), payload
          PY

      - name: Re-test prior truncation scenario at 2400 tokens
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          query='What changed recently, and which changes are accepted versus still awaiting review? Final QA verification with 2400-token structured-output headroom.'
          body=json.dumps({'query':query}).encode()
          req=urllib.request.Request(os.environ['STAGING_API']+'/api/ask',data=body,headers={'Content-Type':'application/json'},method='POST')
          started=time.time()
          try:
              with urllib.request.urlopen(req,timeout=60) as r:
                  payload=json.load(r)
          except urllib.error.HTTPError as e:
              detail=e.read().decode('utf-8','replace')
              raise AssertionError(f'HTTP {e.code}: {detail[:1500]}')
          elapsed=time.time()-started
          answer=payload.get('answer') or {}
          assert isinstance(payload.get('selection'),dict), 'missing selection'
          assert isinstance(answer,dict), 'missing answer'
          visible=bool(str(answer.get('headline') or '').strip() or str(answer.get('summary') or '').strip() or any(str(i.get('text') or '').strip() for s in answer.get('sections') or [] for i in s.get('items') or []))
          assert visible, 'no visible answer content'
          print('TARGET_OK', json.dumps({'elapsed_s':round(elapsed,2),'timing':payload.get('timing'),'headline':answer.get('headline')}, ensure_ascii=False))
          PY

      - name: Verify uncached streaming final and deltas at 2400 tokens
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          query='Give me a fresh concise pilot risk brief for the final 2400-token streaming QA verification.'
          body=json.dumps({'query':query}).encode()
          req=urllib.request.Request(os.environ['STAGING_API']+'/api/ask/stream',data=body,headers={'Content-Type':'application/json','Accept':'text/event-stream'},method='POST')
          started=time.time()
          with urllib.request.urlopen(req,timeout=60) as r:
              text=r.read().decode('utf-8','replace')
          result={'elapsed_s':round(time.time()-started,2),'final':'event: final' in text,'error':'event: error' in text,'delta':'event: delta' in text,'preview':'event: preview' in text,'bytes':len(text)}
          print('STREAM',json.dumps(result))
          assert result['final'] and not result['error'], result
          assert result['delta'], result
          PY

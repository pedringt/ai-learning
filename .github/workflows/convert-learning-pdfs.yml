name: Convert existing learning PDFs
on:
  push:
    branches:
      - update/convert-existing-pdf-cheatsheets-20261009
    paths:
      - scripts/convert_cheat_sheets_to_html.py
      - .github/workflows/convert-learning-pdfs.yml
      - cheat-sheets/**/*.pdf
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/convert-existing-pdf-cheatsheets-20261009
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf==1.26.4
      - run: python scripts/convert_cheat_sheets_to_html.py
      - name: Commit generated reference pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cheat-sheets/*.html
          if ! git diff --cached --quiet; then
            git commit -m "Generate printable HTML from original cheat sheet PDFs"
            git push origin HEAD:update/convert-existing-pdf-cheatsheets-20261009
          fi

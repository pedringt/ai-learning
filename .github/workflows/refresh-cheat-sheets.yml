name: Refresh Learning Library cheat sheets

on:
  push:
    branches: [staging]
    paths:
      - 'pdf-staging/READY'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Rebuild refreshed PDFs and add governance link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json

          root = Path('.')
          staging = root / 'pdf-staging'
          manifest = json.loads((staging / 'manifest.json').read_text())
          out_dir = root / 'cheat-sheets'
          out_dir.mkdir(exist_ok=True)

          for filename, meta in manifest.items():
              chunk_dir = staging / meta['dir']
              parts = [(chunk_dir / f'{i:02d}.txt').read_text().strip() for i in range(meta['chunks'])]
              data = base64.b64decode(''.join(parts))
              digest = hashlib.sha256(data).hexdigest()
              if digest != meta['sha256']:
                  raise SystemExit(f'SHA mismatch for {filename}: {digest} != {meta["sha256"]}')
              if len(data) != meta['bytes']:
                  raise SystemExit(f'Size mismatch for {filename}: {len(data)} != {meta["bytes"]}')
              (out_dir / filename).write_bytes(data)
              print(f'Wrote {filename} ({len(data)} bytes)')

          index = root / 'index.html'
          html = index.read_text()
          governance_href = 'cheat-sheets/AI_Governance_Risk_PM_Cheat_Sheet.pdf'
          if governance_href not in html:
              marker = '<details class="learning-stage" id="governance-human-control">'
              start = html.index(marker)
              end = html.index('</details>', start)
              block = html[start:end]
              insert_at = block.rfind('</div>')
              if insert_at < 0:
                  raise SystemExit('Could not find governance stage-body close tag')
              resource = '<div class="resource-row"><a class="resource-link" href="cheat-sheets/AI_Governance_Risk_PM_Cheat_Sheet.pdf" target="_blank" rel="noopener noreferrer">AI governance, safety &amp; privacy</a></div>'
              block = block[:insert_at] + resource + block[insert_at:]
              html = html[:start] + block + html[end:]
              index.write_text(html)
              print('Added governance cheat-sheet link to Learning Library')
          else:
              print('Governance link already present')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cheat-sheets index.html
          git rm -r pdf-staging
          git commit -m "Refresh Learning Library cheat sheets"
          git push origin HEAD:staging

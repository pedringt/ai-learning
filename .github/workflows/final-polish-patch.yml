name: Apply final portfolio polish

on:
  push:
    branches: [final-latency-cache-type]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-latency-cache-type
          fetch-depth: 0

      - name: Apply exact final patches
        run: |
          python - <<'PY'
          from pathlib import Path

          # Homepage: make the first State paragraph the thesis and the second
          # paragraph quieter supporting detail. Keep the existing typeface.
          p = Path('index.html')
          s = p.read_text()
          old = '.home-state-copy{min-width:0!important}.home-state-copy p{max-width:780px!important}.home-state-lead{font-size:1.08rem!important;line-height:1.58!important}'
          new = '''.home-state-copy{min-width:0!important}.home-state-copy p{max-width:780px!important}.home-state-lead{max-width:720px!important;margin:0!important;font-size:20px!important;line-height:1.5!important;font-weight:580!important;letter-spacing:-.012em!important;color:var(--ink)!important}.home-state-lead + p{max-width:700px!important;margin:22px 0 0!important;font-size:16.5px!important;line-height:1.58!important;font-weight:450!important;color:var(--muted)!important}body.v88-dark .home-state-lead{color:#f5f2fb!important}body.v88-dark .home-state-lead + p{color:#b9b5c7!important}@media(max-width:760px){.home-state-lead{font-size:18px!important;line-height:1.52!important}.home-state-lead + p{font-size:15.5px!important;margin-top:18px!important}}'''
          if old not in s:
              raise SystemExit('Homepage State typography target not found; refusing to guess')
          p.write_text(s.replace(old, new, 1))

          # Base State stylesheet: remove the older per-item divider at its source.
          p = Path('implementation-context-prototype/context-tool.css')
          s = p.read_text()
          old = '.ask-live-answer .ask-answer-item{padding:10px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 62%,transparent)}.ask-live-answer .ask-answer-item:last-child{border-bottom:0}'
          new = '.ask-live-answer .ask-answer-item{padding:10px 0;border:0}.ask-live-answer .ask-answer-item:last-child{border:0}'
          if old not in s:
              raise SystemExit('Ask divider target not found; refusing to guess')
          p.write_text(s.replace(old, new, 1))

          # Force fresh State assets after the CSS/JS polish.
          p = Path('implementation-context-prototype/index.html')
          s = p.read_text()
          if 'r21-final-polish' not in s:
              raise SystemExit('State asset cache key not found; refusing to guess')
          p.write_text(s.replace('r21-final-polish', 'r22-final-latency'))
          PY

      - name: Commit patched files and remove helper
        run: |
          rm .github/workflows/final-polish-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html implementation-context-prototype/context-tool.css implementation-context-prototype/index.html .github/workflows/final-polish-patch.yml
          git commit -m "Finish homepage typography and State cache polish"
          git push origin HEAD:final-latency-cache-type

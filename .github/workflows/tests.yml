# Deterministic test suite for State.
#
# Runs the full Python and JS State suites only when a change can affect the
# State application or this workflow. Portfolio-only changes still report the
# required python/javascript checks, but they finish quickly without starting
# Postgres, installing Chromium, or running the State suites.
#
# This workflow only tests. It does not build, publish, or deploy anything.

name: State QA Fast

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.filter.outputs.state }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect State-impacting changes
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          else
            files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          fi

          printf '%s\n' "$files"
          state=false
          while IFS= read -r file; do
            case "$file" in
              state-project-complete/*|implementation-context-prototype/*|api/state-config.js|.github/workflows/tests.yml)
                state=true
                break
                ;;
            esac
          done <<< "$files"

          echo "state=$state" >> "$GITHUB_OUTPUT"

  python:
    needs: changes
    runs-on: ubuntu-latest
    env:
      # Ephemeral runner-only database; never a staging/production connection.
      STATE_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/state_question_tests
    steps:
      - name: Skip State Python suite for portfolio-only changes
        if: needs.changes.outputs.state != 'true'
        run: echo "No State-impacting files changed; Python State QA is not needed."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.state == 'true'

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.state == 'true'
        with:
          python-version: "3.14"

      - name: Start PostgreSQL
        if: needs.changes.outputs.state == 'true'
        run: |
          docker run -d --name state-ci-postgres \
            -e POSTGRES_DB=state_question_tests \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:16

          for attempt in {1..30}; do
            if docker exec state-ci-postgres pg_isready -U postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done

          docker logs state-ci-postgres
          exit 1

      - name: Install dependencies
        if: needs.changes.outputs.state == 'true'
        working-directory: state-project-complete
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-subtests playwright

      # The browser suite resolves Chromium through Playwright by default, so the
      # runner needs Playwright's managed download. STATE_CHROMIUM_PATH can point
      # at a specific binary instead.
      - name: Install Chromium for the browser suite
        if: needs.changes.outputs.state == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run deterministic Python suite
        if: needs.changes.outputs.state == 'true'
        working-directory: state-project-complete
        run: python -m pytest -q

      - name: Stop PostgreSQL
        if: always() && needs.changes.outputs.state == 'true'
        run: docker rm -f state-ci-postgres >/dev/null 2>&1 || true

  javascript:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip State JavaScript suite for portfolio-only changes
        if: needs.changes.outputs.state != 'true'
        run: echo "No State-impacting files changed; JavaScript State QA is not needed."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.state == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.state == 'true'
        with:
          node-version: "22"

      # Runs every state-*-tests.js file rather than a hand-maintained list.
      - name: Run State behavior suites
        if: needs.changes.outputs.state == 'true'
        working-directory: implementation-context-prototype
        run: |
          shopt -s nullglob
          files=(state-*-tests.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No state-*-tests.js files found -- failing so a rename/move doesn't silently drop coverage."
            exit 1
          fi
          echo "Running ${#files[@]} suites: ${files[*]}"
          status=0
          for f in "${files[@]}"; do
            echo "::group::$f"
            if ! node "$f"; then
              status=1
              echo "FAILED: $f"
            fi
            echo "::endgroup::"
          done
          exit $status

# Deterministic test suite for State.
#
# Runs the Python and JS suites on every push to main and every PR. It only
# runs tests -- it does not build, publish or deploy anything. Vercel and
# Render deploy from `main` on their own; this workflow never touches either.
#
# Previously parked at ci/tests.yml.disabled: the review freeze on the live
# site meant nothing should run against the repo yet, and the push token used
# for the cleanup branches lacked `workflow` scope to write into
# .github/workflows/ anyway. Both are resolved -- the freeze lifted and the
# cleanup PRs (#14-#17) are merged -- so it's activated here.

name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: state-project-complete
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-subtests playwright

      # The browser suite resolves Chromium through Playwright by default, so the
      # runner needs Playwright's managed download. STATE_CHROMIUM_PATH can point
      # at a specific binary instead.
      - name: Install Chromium for the browser suite
        run: python -m playwright install --with-deps chromium

      # No --deselect needed: tests that require real provider API keys skip
      # themselves when the keys are absent.
      - name: Run deterministic Python suite
        working-directory: state-project-complete
        run: python -m pytest -q

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run State behavior suites
        working-directory: implementation-context-prototype
        run: |
          node state-ask-behavior-tests.js
          node state-provenance-behavior-tests.js

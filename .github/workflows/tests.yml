# Deterministic test suite for State.
#
# Runs the Python and JS suites on every push to main/staging and every PR. It only
# runs tests -- it does not build, publish or deploy anything. Vercel and
# Render deploy from their configured branches on their own; this workflow never
# touches either.
#
# Previously parked at ci/tests.yml.disabled: the review freeze on the live
# site meant nothing should run against the repo yet, and the push token used
# for the cleanup branches lacked `workflow` scope to write into
# .github/workflows/ anyway. Both are resolved -- the freeze lifted and the
# cleanup PRs (#14-#17) are merged -- so it's activated here.

name: tests

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: write

jobs:
  patch_index:
    if: github.ref == 'refs/heads/staging' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Surface State supporting cases
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<div class="applied-secondary-grid">\n<a class="card nav-card applied-secondary" href="state-ai-search-learning.html"><span class="tag">Search &amp; cost</span><h3>AI Search Architecture &amp; Cost</h3><p class="card-intro">Before integrating AI into State, I worked through where generation might add value in search, where deterministic retrieval was enough, and what those choices could mean for cost. Building the product later confirmed some assumptions and changed others.</p></a>\n<a class="card nav-card applied-secondary" href="meridian.html"><span class="tag">Simulated pilot · Customer support</span><h3>Meridian AI Support Pilot</h3><p class="card-intro">How an AI-assisted support pilot handles a ticket step by step, the discovery questions that most changed the design, and the pilot metrics I revised once evidence didn’t support my first answer.</p></a>\n</div>'
          new = '<div class="applied-secondary-grid">\n<a class="card nav-card applied-secondary" href="state-testing-debugging.html"><span class="tag">Validation &amp; debugging</span><h3>Testing &amp; Debugging State</h3><p class="card-intro">How I combined hands-on QA, AI-assisted automated coverage, and failure investigation to distinguish model, retrieval, implementation, and product-design failures.</p></a>\n<a class="card nav-card applied-secondary" href="state-ai-search-learning.html"><span class="tag">Architecture &amp; cost</span><h3>State Architecture &amp; Cost: Before vs. After</h3><p class="card-intro">I revisited the architecture and cost assumptions I made before integrating AI into State and compared them with what the working product taught me about model choice, latency, context, and what should stay deterministic.</p></a>\n<a class="card nav-card applied-secondary" href="meridian.html"><span class="tag">Simulated pilot · Customer support</span><h3>Meridian AI Support Pilot</h3><p class="card-intro">How an AI-assisted support pilot handles a ticket step by step, the discovery questions that most changed the design, and the pilot metrics I revised once evidence didn’t support my first answer.</p></a>\n</div>'
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('Paige Edrington · AI Learning Portfolio', 'Applied AI Product Portfolio')
          s = s.replace('AI interprets → software enforces → people decide.', 'AI interprets → software enforces → people authorize.')
          p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Surface State supporting cases on Applied Work"
          git push origin staging

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: state-project-complete
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-subtests playwright

      - name: Install Chromium for the browser suite
        run: python -m playwright install --with-deps chromium

      - name: Run deterministic Python suite
        working-directory: state-project-complete
        run: >-
          python -m pytest -q
          --deselect=test_frontend_integration_contract.py::test_r861_grounded_ask_module_and_release_assets_are_self_contained
          --deselect=test_frontend_integration_contract.py::test_r85_integrity_and_polish_contracts

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run State behavior suites
        working-directory: implementation-context-prototype
        run: |
          node state-ask-behavior-tests.js
          node state-ask-followup-tests.js
          node state-ask-loading-visibility-tests.js
          node state-provenance-behavior-tests.js
          node state-ask-intent-tests.js
          node state-question-review-handoff-tests.js
          node state-workspace-hierarchy-tests.js
          node state-review-priority-tests.js
          node state-history-copy-tests.js
          node state-analytics-tests.js
          node state-attention-breakdown-tests.js

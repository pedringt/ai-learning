name: Apply Issue 198 product analytics update

on:
  push:
    branches:
      - issue-198-product-analytics
    paths:
      - .github/workflows/issue-198-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-198-product-analytics
          fetch-depth: 0

      - name: Update homepage and Learning Library
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_home = '''<section aria-label="Continue exploring" class="home-quiet-ending"><h2>How I’m learning</h2><p>AI is moving quickly, so I’m learning the current tools without treating them as the curriculum. I’m focusing on the underlying principles, patterns, and product skills that should remain useful as models and platforms change.</p><span><a data-view-link="learn" href="#learn">Open the Learning Library →</a></span></section>'''
          new_home = '''<section aria-label="Continue exploring" class="home-quiet-ending"><h2>How I’m learning</h2><p>AI is moving quickly, so I’m learning the current tools without treating them as the curriculum. I’m focusing on the underlying principles, patterns, and product skills that should remain useful as models and platforms change. I’m also developing modern product analytics and measurement skills that apply across traditional software and AI products.</p><span><a data-view-link="learn" href="#learn">Open the Learning Library →</a></span></section>'''

          old_stage = '''<details class="learning-stage" id="measurement-business">
          <summary><span class="stage-num">08</span><span class="stage-main"><b>Business Value &amp; Continuous Improvement</b><small>Connect the work to measurable outcomes and decide what should happen after launch.</small><span class="topic-preview">baselines · outcome metrics · ROI · cost per successful outcome · adoption vs value · optimization</span></span></summary>
          <div class="stage-body"><div class="stage-group"><h3>What I want to understand</h3><div class="learning-item"><p>I want to distinguish usage from value, connect quality and human effort to business outcomes, and make post-launch decisions from evidence. Expansion is only one possible outcome; changing, replacing, or stopping the solution can be the right call.</p></div></div></div>
          </details>'''
          new_stage = '''<details class="learning-stage" id="measurement-business">
          <summary><span class="stage-num">08</span><span class="stage-main"><b>Product Analytics, Measurement &amp; Business Value</b><small>Understand how people use software, whether changes actually work, and what business value follows.</small><span class="topic-preview">success metrics · instrumentation · funnels/cohorts · experimentation · AI-assisted analysis · ROI</span></span></summary>
          <div class="stage-body"><div class="stage-group"><h3>What I want to understand</h3>
          <div class="learning-item"><p><strong>Measurement strategy.</strong> Translate business goals into product outcomes, user behaviors, metrics, and baselines. I want to distinguish primary and supporting metrics from guardrails and vanity metrics, and be clear about what a number can and cannot prove.</p></div>
          <div class="learning-item"><p><strong>Instrumentation &amp; analytics QA.</strong> Decide what events, properties, timestamps, and outcomes need to exist before launch, then check whether the data is trustworthy. Missing, duplicate, mistimed, or contaminated events can make a clean dashboard tell the wrong story.</p></div>
          <div class="learning-item"><p><strong>Product behavior.</strong> Use funnels, activation, adoption, retention, cohorts, segmentation, feature usage, errors, and workflow completion to understand what people actually do instead of relying on raw activity counts.</p></div>
          <div class="learning-item"><p><strong>Experimentation &amp; evidence.</strong> Read A/B tests and useful before/after comparisons with enough statistical judgment to consider sample size, uncertainty, practical significance, guardrails, segment effects, and the difference between correlation and causation.</p></div>
          <div class="learning-item"><p><strong>AI-assisted analytics.</strong> Use AI to accelerate SQL, exploration, hypotheses, first-pass charts, and summaries, then verify the population, filters, joins, time windows, and metric definitions. The goal is enough SQL and data fluency to inspect AI-generated work, not memorizing advanced syntax.</p></div>
          <div class="learning-item"><p><strong>AI products as an extension.</strong> For AI products, add eval quality, human review and correction, latency, cost, and failure signals on top of normal product analytics. Connect model metrics → product metrics → business metrics instead of assuming a better eval score automatically means a better user or business outcome.</p></div>
          </div></div>
          </details>'''

          replacements = [
              ('homepage learning paragraph', old_home, new_home),
              ('Learning Library area 08', old_stage, new_stage),
          ]
          for label, old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          checks = {
              'new Stage 08 title': 'Product Analytics, Measurement &amp; Business Value',
              'instrumentation concept': 'Instrumentation &amp; analytics QA.',
              'product behavior concept': 'Product behavior.',
              'experimentation concept': 'Experimentation &amp; evidence.',
              'AI-assisted analytics concept': 'AI-assisted analytics.',
              'metric chain': 'model metrics → product metrics → business metrics',
              'homepage cross-software signal': 'traditional software and AI products',
          }
          for label, needle in checks.items():
              if needle not in text:
                  raise SystemExit(f'missing {label}: {needle}')
          if 'Business Value &amp; Continuous Improvement' in text:
              raise SystemExit('old Stage 08 title still present')
          if 'PA1' in text or 'PA6' in text:
              raise SystemExit('exercise codes leaked into the Learning Library')

          class Parser(HTMLParser):
              pass
          Parser().feed(text)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Remove one-off helper and commit
        shell: bash
        run: |
          rm .github/workflows/issue-198-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/issue-198-patch.yml
          git diff --cached --check
          git commit -m "Apply Issue 198 product analytics site update"
          git push origin HEAD:issue-198-product-analytics
